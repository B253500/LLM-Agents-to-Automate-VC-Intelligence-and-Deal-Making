services:
  n8n:
    build: .
    ports:
      - "5678:5678"
    volumes:
      - ./data:/home/node/.n8n
      - ../:/home/node/project
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=<your-user>
      - N8N_BASIC_AUTH_PASSWORD=<your-password>
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Asia/Almaty
